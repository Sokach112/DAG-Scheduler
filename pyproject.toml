[project]
name = "dag-scheduler"
version = "0.1.0"
description = "DAG-based task scheduler with CPM and resource-constrained scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "graphxlib>=0.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
