[project]
name = "dag-scheduler"
version = "0.1.0"
description = "DAG-based task scheduler with CPM and resource-constrained scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Limitless", email = "2386099807@qq.com" },
]
keywords = ["scheduler", "dag", "cpm", "critical-path", "resource-scheduling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "graphxlib>=0.1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23", "sqlalchemy>=2.0"]
dev = ["pytest>=7.0", "pytest-timeout>=2.0", "httpx2"]

[project.urls]
Homepage = "https://github.com/Sokach112/DAG-Scheduler"
Repository = "https://github.com/Sokach112/DAG-Scheduler"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dag_scheduler*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 10
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
[tool.setuptools.package-data]
dag_scheduler = ["data/holidays/**/*.json"]
