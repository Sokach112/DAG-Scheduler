services:
  api:
    build: .
    image: dag-scheduler-api
    container_name: dag-scheduler-api
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - DAG_SCHEDULER_DB=/app/data/scheduler.db
    volumes:
      - dag-scheduler-data:/app/data
    restart: unless-stopped

volumes:
  dag-scheduler-data: